services:
  postgres:
    image: postgres:16-alpine
    container_name: mastera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mastera
      POSTGRES_PASSWORD: mastera_dev_password
      POSTGRES_DB: mastera_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mastera-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: mastera-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mastera_s3_admin
      MINIO_ROOT_PASSWORD: mastera_s3_password_123
    ports:
      - "9000:9000"   # S3 API port
      - "9001:9001"   # MinIO Web Console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: