name: CI Test, Lint & Quality Gates

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

jobs:
  ci-gates:
    name: Build, Gate Assertions & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Full Monorepo CI Quality Gates
        run: npm run ci:gates
