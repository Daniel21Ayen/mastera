name: Mobile Size Gate (< 20 MB arm64)

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  mobile-size-gate:
    name: Verify arm64 Download Size < 20 MB (D2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Release Gates (Size, Seed, Contrast & RAM)
        run: npm run verify:release-gates
